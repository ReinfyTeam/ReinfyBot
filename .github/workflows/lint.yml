# This workflow installs dependencies and runs optional build and lint scripts across supported Node.js versions.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build and lint ReinfyBot

on: [push, pull_request]

jobs:
  build:
    name: Build and lint ReinfyBot

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Check out repository
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
    - name: Install Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install Node.js dependencies
      run: npm ci
    - name: Run optional build script
      run: npm run build --if-present
    - name: Run optional lint script
      run: npm run check-lint --if-present
